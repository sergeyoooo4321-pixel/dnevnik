name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'www/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump versionCode/versionName
        working-directory: android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName .*/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          echo "--- updated build.gradle ---"
          grep -E "versionCode|versionName" build.gradle

      - name: Use stable debug keystore (so updates aren't rejected by signature mismatch)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/dnevnik.apk

      - name: Bundle www.zip (capgo OTA payload)
        run: |
          mkdir -p out
          cd www && zip -r ../out/www.zip . && cd ..
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnevnik-apk
          path: out/dnevnik.apk

      - name: Delete previous "latest" release
        if: github.ref == 'refs/heads/main'
        run: gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Свежая сборка дневника.

            **Установка на Samsung:**
            1. Скачай `dnevnik.apk` ниже.
            2. Открой файл на телефоне → разреши установку из этого источника.
            3. Установи.

            Если не приходят уведомления — отключи оптимизацию батареи для приложения «Дневник».
          files: |
            out/dnevnik.apk
            out/www.zip
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json (capgo OTA pointer)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          CODE=${{ github.run_number }}
          cat > www/manifest.json <<EOF
          {
            "version": "${PKG_VERSION}",
            "code": ${CODE},
            "url": "https://github.com/${{ github.repository }}/releases/download/latest/www.zip"
          }
          EOF
          cat www/manifest.json
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git diff --quiet www/manifest.json; then
            echo "manifest.json unchanged — skipping commit"
          else
            git add www/manifest.json
            git commit -m "ci: publish manifest.json [skip ci]"
            git push origin HEAD:main
          fi
