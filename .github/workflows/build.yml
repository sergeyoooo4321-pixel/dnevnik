name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump compileSdk/targetSdk to 35
        working-directory: android
        run: |
          # Свежие зависимости Capgo (>=6.45) требуют compileSdk=35,
          # а Capacitor 6 по дефолту ставит 34. Поднимаем без апгрейда
          # самого Capacitor.
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' variables.gradle
          echo "--- variables.gradle ---"
          grep -E "compileSdk|targetSdk|minSdk" variables.gradle

      - name: Harden AndroidManifest (allowBackup=false)
        working-directory: android/app/src/main
        run: |
          # Запрещаем adb backup, чтобы дневник нельзя было слить с устройства.
          if grep -q 'android:allowBackup' AndroidManifest.xml; then
            sed -i 's/android:allowBackup="[^"]*"/android:allowBackup="false"/' AndroidManifest.xml
          else
            sed -i 's|<application |<application android:allowBackup="false" |' AndroidManifest.xml
          fi
          grep -E "allowBackup|application " AndroidManifest.xml | head -3

      - name: Disable R8 minification (защита от поломки WebView/плагинов)
        working-directory: android/app
        run: |
          # Capacitor-плагины используют рефлексию; R8 может их выкинуть.
          # Лучше отключить, пока специально не настроена ProGuard-конфигурация.
          if grep -q 'minifyEnabled' build.gradle; then
            sed -i 's/minifyEnabled true/minifyEnabled false/' build.gradle
          fi
          grep -E "minifyEnabled|shrinkResources" build.gradle || true

      - name: Compute version
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          OTA_VERSION="${BASE}.${{ github.run_number }}"
          echo "ota_version=${OTA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "OTA version = ${OTA_VERSION}"

      - name: Bump versionCode/versionName
        working-directory: android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.ota_version }}\"/" build.gradle
          echo "--- updated build.gradle ---"
          grep -E "versionCode|versionName" build.gradle

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Stage release artifacts
        run: |
          mkdir -p out
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" out/dnevnik.apk
          cd www && zip -r ../out/www.zip . && cd ..
          # checksum намеренно НЕ добавлен: capacitor-updater 6.0.1 ожидает
          # CRC32, а наш SHA-256 у него не сходится и плагин зависает после
          # download. Целостность TLS-канала GitHub Releases считаем достаточной.
          cat > out/manifest.json <<EOF
          {
            "version": "${{ steps.ver.outputs.ota_version }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/latest/www.zip"
          }
          EOF
          echo "--- manifest ---"
          cat out/manifest.json
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnevnik-apk
          path: out/dnevnik.apk

      - name: Delete previous "latest" release
        if: github.ref == 'refs/heads/main'
        run: gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Свежая сборка дневника. Версия: ${{ steps.ver.outputs.ota_version }}

            **Первичная установка на Samsung:**
            1. Скачай `dnevnik.apk` ниже.
            2. Открой файл на телефоне → разреши установку из этого источника.
            3. Установи.

            **Дальше — обновляйся прямо в приложении**: три точки → «Проверить обновления» → «Обновить до vX». APK переустанавливать не надо.

            Если не приходят уведомления — отключи оптимизацию батареи для приложения «Дневник».
          files: |
            out/dnevnik.apk
            out/www.zip
            out/manifest.json
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
