name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Compute version
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          OTA_VERSION="${BASE}.${{ github.run_number }}"
          echo "ota_version=${OTA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "OTA version = ${OTA_VERSION}"

      - name: Inject build info
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/latest/dnevnik.apk"
          cat > www/build-info.js <<EOF
          window.BUILD_SHA = "${{ github.sha }}";
          window.BUILD_VERSION = "${{ steps.ver.outputs.ota_version }}";
          window.BUILD_TIME = "${BUILD_TIME}";
          EOF
          cat > www/version.json <<EOF
          {
            "version": "${{ steps.ver.outputs.ota_version }}",
            "sha": "${{ github.sha }}",
            "buildTime": "${BUILD_TIME}",
            "apkUrl": "${APK_URL}",
            "sha256": ""
          }
          EOF
          cat www/build-info.js
          cat www/version.json

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android project for CI
        run: bash scripts/patch-android-ci.sh

      - name: Bump versionCode/versionName
        working-directory: android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.ota_version }}\"/" build.gradle
          echo "--- updated build.gradle ---"
          grep -E "versionCode|versionName" build.gradle

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        run: |
          mkdir -p out
          KEYSTORE_PATH="$RUNNER_TEMP/dnevnik-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          fi
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Unsigned APK not found" >&2
            exit 1
          fi

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" out/dnevnik-aligned.apk
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out out/dnevnik.apk \
            out/dnevnik-aligned.apk
          "$APKSIGNER" verify --verbose out/dnevnik.apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Stage release artifacts
        run: |
          APK_SHA256="$(sha256sum out/dnevnik.apk | awk '{print $1}')"
          BUILD_TIME="$(node -p "require('./www/version.json').buildTime")"
          cat > out/version.json <<EOF
          {
            "version": "${{ steps.ver.outputs.ota_version }}",
            "sha": "${{ github.sha }}",
            "buildTime": "${BUILD_TIME}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest/dnevnik.apk",
            "sha256": "${APK_SHA256}"
          }
          EOF
          ls -la out/
          cat out/version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dnevnik-apk
          path: |
            out/dnevnik.apk
            out/version.json

      - name: Delete previous "latest" release
        if: github.ref == 'refs/heads/main'
        run: gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: |
            ${{ github.sha }}

            Свежая сборка дневника. Версия: ${{ steps.ver.outputs.ota_version }}
            Метаданные обновления: `version.json`.

            **Первичная установка на Samsung:**
            1. Скачай `dnevnik.apk` ниже.
            2. Открой файл на телефоне → разреши установку из этого источника.
            3. Установи.

            **Дальше — кнопка «Обновить» в приложении** (три точки → Обновить) сравнит SHA коммита с текущей сборкой и предложит скачать новый APK.

            Если не приходят уведомления — отключи оптимизацию батареи для приложения «Дневник».
          files: |
            out/dnevnik.apk
            out/version.json
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
