name: Build Play AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Compute version
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          OTA_VERSION="${BASE}.${{ github.run_number }}"
          echo "ota_version=${OTA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "OTA version = ${OTA_VERSION}"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android project for CI
        run: bash scripts/patch-android-ci.sh

      - name: Bump versionCode/versionName
        working-directory: android/app
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.ota_version }}\"/" build.gradle
          echo "--- updated build.gradle ---"
          grep -E "versionCode|versionName" build.gradle

      - name: Build release AAB (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Sign release AAB
        run: |
          mkdir -p out
          KEYSTORE_PATH="$RUNNER_TEMP/dnevnik-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          UNSIGNED_AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          if [ -z "$UNSIGNED_AAB" ]; then
            echo "Release AAB not found" >&2
            exit 1
          fi
          jarsigner \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar out/dnevnik-play.aab \
            "$UNSIGNED_AAB" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs out/dnevnik-play.aab
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Stage release artifacts
        run: |
          sha256sum out/dnevnik-play.aab > out/dnevnik-play.aab.sha256
          ls -la out/
          cat out/dnevnik-play.aab.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dnevnik-play-aab
          path: |
            out/dnevnik-play.aab
            out/dnevnik-play.aab.sha256
