<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Дневник</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar-title" id="screenTitle">День</h1>
    <button class="kebab" id="kebabBtn" aria-label="Меню" aria-haspopup="true" aria-expanded="false">
      <span class="kebab-dot"></span>
      <span class="kebab-dot"></span>
      <span class="kebab-dot"></span>
    </button>
    <div class="menu-backdrop" id="menuBackdrop" hidden></div>
    <div class="menu" id="menu" role="menu" hidden>
      <button class="menu-item active" role="menuitem" data-tab="today">День</button>
      <button class="menu-item" role="menuitem" data-tab="notes">Заметки</button>
      <button class="menu-item" role="menuitem" data-tab="history">История</button>
      <button class="menu-item" role="menuitem" data-tab="reminders">Напоминания</button>
      <button class="menu-item" role="menuitem" data-tab="plan">График</button>
      <button class="menu-item" role="menuitem" data-tab="data">Данные</button>
    </div>
  </header>

  <main>
    <!-- ===== СЕГОДНЯ ===== -->
    <section id="today" class="screen active">
      <div class="subtitle" id="todayDate"></div>

      <div class="field">
        <label>Оценка дня</label>
        <div class="stars" id="stars"></div>
        <div class="rating-value" id="ratingValue">—</div>
      </div>

      <div class="field">
        <div class="label-row">
          <label>Что сделал сегодня</label>
          <button class="mic" data-target="done" aria-label="Голос">🎤</button>
        </div>
        <textarea id="done" placeholder="Что было сделано…"></textarea>
      </div>

      <div class="field">
        <div class="label-row">
          <label>Что улучшить</label>
          <button class="mic" data-target="improve" aria-label="Голос">🎤</button>
        </div>
        <textarea id="improve" placeholder="Что хочется поправить…"></textarea>
      </div>

      <button id="save" class="primary">Сохранить день</button>
    </section>

    <!-- ===== ЗАМЕТКИ ===== -->
    <section id="notes" class="screen">
      <div class="card">
        <div class="field">
          <div class="label-row">
            <label>Новая заметка</label>
            <button class="mic" data-target="noteText" aria-label="Голос">🎤</button>
          </div>
          <textarea id="noteText" placeholder="Мысль, идея, что угодно…"></textarea>
        </div>

        <div class="field">
          <label>Метка</label>
          <div class="tag-picker" id="tagPicker"></div>
        </div>

        <button id="addNote" class="primary">Добавить заметку</button>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>Фильтр</label>
        <div class="tag-picker" id="filterPicker"></div>
      </div>

      <div id="notesList"></div>
    </section>

    <!-- ===== ИСТОРИЯ ===== -->
    <section id="history" class="screen">
      <div id="entries"></div>
    </section>

    <!-- ===== НАПОМИНАНИЯ ===== -->
    <section id="reminders" class="screen">
      <div class="card">
        <div class="seg" id="reminderMode">
          <button class="seg-btn active" data-mode="once">Разовое</button>
          <button class="seg-btn" data-mode="daily">Каждый день</button>
        </div>

        <div class="field">
          <div class="label-row">
            <label>Сообщение</label>
            <button class="mic" data-target="reminderText" aria-label="Голос">🎤</button>
          </div>
          <input type="text" id="reminderText" placeholder="Что напомнить?">
        </div>

        <div class="field" id="dateField">
          <label>Дата</label>
          <input type="date" id="reminderDate">
        </div>

        <div class="field">
          <label>Время</label>
          <input type="time" id="reminderTime">
        </div>

        <button id="addReminder" class="primary">Поставить</button>
      </div>

      <div class="divider"></div>

      <div id="remindersList"></div>
    </section>

    <!-- ===== ДАННЫЕ (экспорт/импорт) ===== -->
    <section id="data" class="screen">
      <div class="card">
        <div class="field">
          <label>Экспорт</label>
          <div class="subtitle">Сохрани JSON со всеми записями, заметками, напоминаниями и курсами — пригодится при переустановке приложения или переезде на новое устройство.</div>
          <textarea id="exportText" readonly placeholder="Нажми «Сформировать»…" style="min-height:160px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;"></textarea>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button id="exportBuildBtn" class="ghost">Сформировать</button>
            <button id="exportCopyBtn" class="primary">Скопировать</button>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="card">
        <div class="field">
          <label>Импорт</label>
          <div class="subtitle">Вставь сюда JSON, сохранённый на этапе экспорта. Текущие данные будут перезаписаны.</div>
          <textarea id="importText" placeholder="Вставь JSON сюда…" style="min-height:160px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;"></textarea>
          <button id="importDoBtn2" class="primary" style="margin-top:8px;">Импортировать</button>
        </div>
      </div>
    </section>

    <!-- ===== ГРАФИК ===== -->
    <section id="plan" class="screen">
      <div class="schedule-day-title" id="scheduleDayTitle"></div>
      <div id="scheduleEventList"></div>

      <div class="calendar">
        <div class="calendar-head">
          <button class="cal-nav" id="calPrev" aria-label="Предыдущий месяц">‹</button>
          <div class="calendar-month" id="calMonth"></div>
          <button class="cal-nav" id="calNext" aria-label="Следующий месяц">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
      </div>

      <button class="fab" id="addEventBtn" aria-label="Добавить событие">+ Добавить</button>
    </section>
  </main>

  <!-- Event modal -->
  <div id="eventOverlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">Новое событие</div>
        <button class="ghost modal-close" id="eventCloseBtn" aria-label="Закрыть">×</button>
      </div>

      <div class="field">
        <label>Время</label>
        <input type="time" id="eventTime">
      </div>

      <div class="field">
        <label>Событие</label>
        <input type="text" id="eventTitle" placeholder="Например, сходить в магазин">
      </div>

      <div class="field">
        <div class="label-row">
          <label>Примечание</label>
          <button class="mic" data-target="eventNote" aria-label="Голос">🎤</button>
        </div>
        <textarea id="eventNote" placeholder="Необязательно"></textarea>
      </div>

      <div class="modal-actions">
        <button class="ghost" id="eventCancelBtn">Отмена</button>
        <button class="primary" id="eventSaveBtn">Добавить</button>
      </div>
    </div>
  </div>

  <div id="otaStatus" class="ota-status" hidden></div>

  <script src="updater.js"></script>
  <script src="app.js"></script>
</body>
</html>
