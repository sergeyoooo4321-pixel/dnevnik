<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Дневник</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar-title" id="screenTitle">День</h1>
    <button class="kebab" id="kebabBtn" aria-label="Меню" aria-haspopup="true" aria-expanded="false">
      <span class="kebab-dot"></span>
      <span class="kebab-dot"></span>
      <span class="kebab-dot"></span>
    </button>
    <div class="menu-backdrop" id="menuBackdrop" hidden></div>
    <div class="menu" id="menu" role="menu" hidden>
      <button class="menu-item active" role="menuitem" data-tab="today">День</button>
      <button class="menu-item" role="menuitem" data-tab="notes">Заметки</button>
      <button class="menu-item" role="menuitem" data-tab="history">История</button>
      <button class="menu-item" role="menuitem" data-tab="reminders">Напоминания</button>
      <button class="menu-item" role="menuitem" data-tab="plan">План</button>
    </div>
  </header>

  <main>
    <!-- ===== СЕГОДНЯ ===== -->
    <section id="today" class="screen active">
      <div class="subtitle" id="todayDate"></div>

      <div id="todayCourses"></div>

      <div class="field">
        <label>Оценка дня</label>
        <div class="stars" id="stars"></div>
        <div class="rating-value" id="ratingValue">—</div>
      </div>

      <div class="field">
        <div class="label-row">
          <label>Что сделал сегодня</label>
          <button class="mic" data-target="done" aria-label="Голос">🎤</button>
        </div>
        <textarea id="done" placeholder="Что было сделано…"></textarea>
      </div>

      <div class="field">
        <div class="label-row">
          <label>Что улучшить</label>
          <button class="mic" data-target="improve" aria-label="Голос">🎤</button>
        </div>
        <textarea id="improve" placeholder="Что хочется поправить…"></textarea>
      </div>

      <button id="save" class="primary">Сохранить день</button>
    </section>

    <!-- ===== ЗАМЕТКИ ===== -->
    <section id="notes" class="screen">
      <div class="card">
        <div class="field">
          <div class="label-row">
            <label>Новая заметка</label>
            <button class="mic" data-target="noteText" aria-label="Голос">🎤</button>
          </div>
          <textarea id="noteText" placeholder="Мысль, идея, что угодно…"></textarea>
        </div>

        <div class="field">
          <label>Метка</label>
          <div class="tag-picker" id="tagPicker"></div>
        </div>

        <button id="addNote" class="primary">Добавить заметку</button>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>Фильтр</label>
        <div class="tag-picker" id="filterPicker"></div>
      </div>

      <div id="notesList"></div>
    </section>

    <!-- ===== ИСТОРИЯ ===== -->
    <section id="history" class="screen">
      <div id="entries"></div>
    </section>

    <!-- ===== НАПОМИНАНИЯ ===== -->
    <section id="reminders" class="screen">
      <div class="card">
        <div class="seg" id="reminderMode">
          <button class="seg-btn active" data-mode="once">Разовое</button>
          <button class="seg-btn" data-mode="daily">Каждый день</button>
        </div>

        <div class="field">
          <div class="label-row">
            <label>Сообщение</label>
            <button class="mic" data-target="reminderText" aria-label="Голос">🎤</button>
          </div>
          <input type="text" id="reminderText" placeholder="Что напомнить?">
        </div>

        <div class="field" id="dateField">
          <label>Дата</label>
          <input type="date" id="reminderDate">
        </div>

        <div class="field">
          <label>Время</label>
          <input type="time" id="reminderTime">
        </div>

        <button id="addReminder" class="primary">Поставить</button>
      </div>

      <div class="divider"></div>

      <div id="remindersList"></div>
    </section>

    <!-- ===== ПЛАН (course tracker) ===== -->
    <section id="plan" class="screen">
      <!-- View 1: list of courses -->
      <div id="planCourses">
        <div class="plan-head">
          <div class="plan-head-title">Мои курсы</div>
          <button class="ghost plan-import-btn" id="openImportBtn">+ Импорт</button>
        </div>
        <div id="coursesList"></div>
      </div>

      <!-- View 2: course detail (day list) -->
      <div id="planCourseDetail" hidden>
        <button class="ghost back-btn" id="backToCoursesBtn">← Курсы</button>
        <div id="courseDetailHead"></div>
        <div id="daysList"></div>
      </div>

      <!-- View 3: day detail -->
      <div id="planDayDetail" hidden>
        <button class="ghost back-btn" id="backToDaysBtn">← Дни</button>
        <div id="dayDetailBody"></div>
      </div>
    </section>
  </main>

  <!-- Import course modal -->
  <div id="importOverlay" class="import-overlay" hidden>
    <div class="import-modal">
      <div class="import-head">
        <div class="import-title">Импорт курса</div>
        <button class="ghost import-close" id="importCloseBtn" aria-label="Закрыть">×</button>
      </div>

      <div class="field">
        <label>Название курса</label>
        <input type="text" id="importName" placeholder="Мой курс">
      </div>

      <div class="field">
        <label>Цель</label>
        <input type="text" id="importGoal" placeholder="Необязательно">
      </div>

      <div class="field">
        <label>Дата старта</label>
        <input type="date" id="importStart">
      </div>

      <div class="field">
        <div class="label-row">
          <label>Markdown курса</label>
          <button class="mic" data-target="importMarkdown" aria-label="Голос">🎤</button>
        </div>
        <textarea id="importMarkdown" placeholder="Вставь сюда markdown…" style="min-height:180px;"></textarea>
      </div>

      <div class="import-actions">
        <button class="ghost" id="importCancelBtn">Отмена</button>
        <button class="primary" id="importDoBtn">Импортировать</button>
      </div>
    </div>
  </div>

  <!-- Phase timer overlay -->
  <div id="timerOverlay" class="timer-overlay" hidden>
    <div class="timer-label" id="timerLabel">Теория</div>
    <div class="timer-time" id="timerTime">30:00</div>
    <div class="timer-sub" id="timerSub">День 1</div>
    <div class="timer-actions">
      <button class="ghost" id="timerPause">Пауза</button>
      <button class="ghost" id="timerExtend">+5 мин</button>
      <button class="primary" id="timerStop">Стоп</button>
    </div>
  </div>

  <div id="otaStatus" class="ota-status" hidden></div>

  <script src="updater.js"></script>
  <script src="app.js"></script>
</body>
</html>
